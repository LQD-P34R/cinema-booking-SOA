spring:
  datasource:
    url: jdbc:h2:mem:booking_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
cinema:
  movie-service-url: http://localhost:18082
  payment-service-url: http://localhost:18084
  booking:
    hold-minutes: 5
    payment-lease-seconds: 30
    expiration-scan-ms: 600000
