server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # File trong /assets/ do Vite đặt tên theo nội dung (có mã băm) nên cache lâu được
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router xử lý đường dẫn ở phía trình duyệt. Gõ thẳng /movies/1 hoặc /admin
    # hoặc bấm F5 thì nginx không có file đó, nên phải trả về index.html để React tự định tuyến.
    # Không có dòng này, F5 ở bất kỳ trang nào ngoài trang chủ cũng báo 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
